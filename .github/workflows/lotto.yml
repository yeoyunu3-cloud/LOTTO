name: 로또 당첨번호 자동 수집

on:
  schedule:
    # GitHub cron은 UTC 기준 + 몇십 분씩 밀릴 수 있어서 여러 번 걸어둠
    # 토요일 12:00 / 13:00 / 14:00 UTC = 21:00 / 22:00 / 23:00 KST
    - cron: "0 12,13,14 * * 6"
    # 일요일 아침 한 번 더 (토요일 밤에 사이트 반영이 늦었을 때 대비)
    - cron: "0 0 * * 0"
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 당첨번호 수집
        run: python 01.py

      - name: 새 데이터가 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto_all.csv lotto_frequency.csv
          if git diff --cached --quiet; then
            echo "새 회차 없음"
          else
            ROUND=$(tail -1 lotto_all.csv | cut -d, -f1)
            git commit -m "${ROUND}회 당첨번호 추가"
            git push
          fi
